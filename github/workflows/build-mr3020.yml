name: Build OpenWrt 23.05 for MR3020 16MB

on:
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget
          sudo timedatectl set-timezone Asia/Tashkent

      - name: Clone OpenWrt source
        run: |
          git clone https://github.com/openwrt/openwrt.git -b openwrt-23.05 openwrt
          cd openwrt

      - name: Patch for 16MB Flash
        run: |
          cd openwrt
          # 1. Правим DTS-файл (расширяем раздел firmware до ~16МБ)
          DTS_FILE="target/linux/ath79/dts/ar9331_tplink_tl-mr3020-v1.dts"
          sed -i 's/reg = <0x020000 0x3c0000>;/reg = <0x020000 0xfd0000>;/' $DTS_FILE
          
          # 2. Правим файл образа (меняем шаблон с 4mlzma на 16mlzma)
          MK_FILE="target/linux/ath79/image/tiny-tp-link.mk"
          sed -i '/define Device\/tplink_tl-mr3020-v1/,/endef/ s/\$(Device\/tplink-4mlzma)/$(Device\/tplink-16mlzma)/' $MK_FILE

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config
        run: |
          cd openwrt
          # Базовые настройки для вашей платы и включение LuCI
          echo "CONFIG_TARGET_ath79=y" >> .config
          echo "CONFIG_TARGET_ath79_generic=y" >> .config
          echo "CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3020-v1=y" >> .config
          echo "CONFIG_TARGET_MULTI_PROFILE=y" >> .config
          echo "CONFIG_TARGET_PER_DEVICE_ROOTFS=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_openssh-sftp-server=y" >> .config
          make defconfig

      - name: Download package
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "compile done"

      - name: Upload firmware
        uses: actions/upload-artifact@main
        with:
          name: OpenWrt_MR3020_16MB
          path: openwrt/bin/targets/ath79/generic/*.bin