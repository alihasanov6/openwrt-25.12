name: Build MR3020 16MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone OpenWrt 25.12
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git -b openwrt-25.12 openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch MR3020 for 16MB
        run: |
          cd openwrt
          python3 - <<'PY'
          from pathlib import Path
          dts_path = Path("target/linux/ath79/dts/ar9331_tplink_tl-mr3020-v1.dts")
          dts = dts_path.read_text()
          replacements = [
              ("reg = <0x020000 0x3c0000>;", "reg = <0x020000 0xfc0000>;"),
              ("partition@3e0000 {", "partition@fe0000 {"),
              ("reg = <0x3e0000 0x010000>;", "reg = <0xfe0000 0x010000>;"),
              ("partition@3f0000 {", "partition@ff0000 {"),
              ("reg = <0x3f0000 0x010000>;", "reg = <0xff0000 0x010000>;"),
          ]
          for old, new in replacements:
              if dts.count(old) != 1:
                  raise SystemExit(f"Expected exactly one: {old}")
              dts = dts.replace(old, new, 1)
          dts_path.write_text(dts)

          image_path = Path("target/linux/ath79/image/tiny-tp-link.mk")
          image = image_path.read_text()
          old = """define Device/tplink_tl-mr3020-v1
            $(Device/tplink-4mlzma)
            IMAGE_SIZE := 3840k"""
          new = """define Device/tplink_tl-mr3020-v1
            $(Device/tplink-16mlzma)
            IMAGE_SIZE := 16128k"""
          if image.count(old) != 1:
              raise SystemExit("MR3020 profile not found")
          image_path.write_text(image.replace(old, new, 1))
          print("16MB partition layout prepared")
          PY

      - name: Configure
        run: |
          cd openwrt
          cat << 'EOF' > .config
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_tiny=y
          CONFIG_TARGET_ath79_tiny_DEVICE_tplink_tl-mr3020-v1=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          EOF
          make defconfig

      - name: Compile
        run: |
          cd openwrt
          make download -j8
          make -j$(nproc) || make -j1 V=s

      - name: List Build Outputs
        run: |
          cd openwrt
          find bin/targets/ -type f \( -name "*.bin" -o -name "*.manifest" \) -print

      - name: Upload Firmware
        uses: actions/upload-artifact@main
        with:
          name: OpenWrt_MR3020_16MB
          path: openwrt/bin/targets/ath79/tiny/*.bin
